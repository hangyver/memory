<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dinner of Memory - 기억의 저녁식사</title>
    <!-- New Fonts: Gowun Dodum for Korean, Playfair Display for Titles -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Playfair+Display:ital,wght@0,700;1,700&family=Orbitron:wght@700&family=Do+Hyeon&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Mobile Portrait Warning Overlay -->
    <div id="rotate-warning" class="rotate-warning">
        <div class="warning-content">
            <div class="phone-icon">📱</div>
            <h2>가로 모드로 돌려주세요</h2>
            <p>Pleaes rotate your device<br>to landscape mode</p>
        </div>
    </div>

    <div class="game-container">
        <!-- Game Title -->
        <h1 id="game-title" class="main-title">기억의 저녁식사</h1>

        <!-- New: How to Play Button & Language Toggle -->
        <div class="top-controls">
            <button id="lang-btn" class="control-btn">ENGLISH</button>
            <button id="reset-btn" class="control-btn">초기화</button>
            <button id="tutorial-btn" class="control-btn">게임 방법</button>
        </div>

        <!-- Custom Modal Overlay -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal-content">
                <h2 id="modal-title">알림</h2>
                <div id="modal-body">내용</div>
                <button id="modal-close-btn">확인</button>
            </div>
        </div>
        
        <!-- Tutorial Modal (Separate to allow simpler content swapping or distinct style) -->
        <div id="tutorial-overlay" class="modal-overlay hidden">
            <div class="modal-content tutorial-content">
                <h2>게임 방법</h2>
                <div class="tutorial-slides">
                    <!-- Dynamic Content -->
                </div>
                <div class="tutorial-controls">
                    <button id="prev-step-btn" style="display:none;">이전</button>
                    <span id="step-indicator">1 / 4</span>
                    <button id="next-step-btn">다음</button>
                    <button id="close-tutorial-btn" style="display:none;">닫기</button>
                </div>
            </div>
        </div>

        <!-- Player A (Left) -->
        <div class="player-area player-a">
            <div class="chips-container">
                <div class="chip-count">x <span id="score-a">45</span></div>
                <div class="chip-stack red">
                    <!-- Chips will be generated by CSS/JS visually -->
                    <div class="chip"></div>
                    <div class="chip"></div>
                    <div class="chip"></div>
                    <div class="chip"></div>
                    <div class="chip"></div>
                </div>
            </div>
            <div class="player-avatar">
                <div class="avatar-head"></div>
                <div class="avatar-body">A</div>
            </div>
        </div>

        <!-- Center Board -->
        <div class="board-area">
            <div class="game-status" id="game-status">
                Game Loading...
            </div>
            <div class="plate-circle" id="plate-circle">
                <!-- Plates will be generated by JS -->
            </div>
        </div>

        <!-- Player B (Right) -->
        <div class="player-area player-b">
            <div class="chips-container">
                <div class="chip-count">x <span id="score-b">45</span></div>
                <div class="chip-stack green">
                    <div class="chip"></div>
                    <div class="chip"></div>
                    <div class="chip"></div>
                    <div class="chip"></div>
                    <div class="chip"></div>
                </div>
            </div>
            <div class="player-avatar">
                <div class="avatar-head"></div>
                <div class="avatar-body">B</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
