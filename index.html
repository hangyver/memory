<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinner of Memory - 기억의 저녁식사</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Player A (Left) -->
        <div class="player-area player-a">
            <div class="chips-container">
                <div class="chip-count">x <span id="score-a">45</span></div>
                <div class="chip-stack red">
                    <!-- Chips will be generated by CSS/JS visually -->
                    <div class="chip"></div>
                    <div class="chip"></div>
                    <div class="chip"></div>
                    <div class="chip"></div>
                    <div class="chip"></div>
                </div>
            </div>
            <div class="player-avatar">
                <div class="avatar-head"></div>
                <div class="avatar-body">A</div>
            </div>
        </div>

        <!-- Center Board -->
        <div class="board-area">
            <div class="game-status" id="game-status">
                Game Loading...
            </div>
            <div class="plate-circle" id="plate-circle">
                <!-- Plates will be generated by JS -->
            </div>
        </div>

        <!-- Player B (Right) -->
        <div class="player-area player-b">
            <div class="chips-container">
                <div class="chip-count">x <span id="score-b">45</span></div>
                <div class="chip-stack green">
                    <div class="chip"></div>
                    <div class="chip"></div>
                    <div class="chip"></div>
                    <div class="chip"></div>
                    <div class="chip"></div>
                </div>
            </div>
            <div class="player-avatar">
                <div class="avatar-head"></div>
                <div class="avatar-body">B</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
